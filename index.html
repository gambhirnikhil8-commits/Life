<title>CA Final — May 2027</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#1F2225; --s1:#262A2E; --s2:#2D3238; --s3:#353B42; --s4:#3E454D;
--bd:#373D44; --bd2:#4A525B;
--tx:#E5E9ED; --tx2:#98A2AB; --tx3:#6B747C;
--ac:#7FB0C4; --acd:#22323A; --acb:#3E5F6E;
--ok:#8FBF9F; --okd:#243128;
--am:#D9B57E; --amd:#342A1C;
--ro:#C98B8B; --rod:#332424;
--pu:#A99BD4; --pud:#2A2634;
--r:11px; --f:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
--fm:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
html,body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14.5px;font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}
body{padding-bottom:56px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
b,strong{font-weight:500}
#cfx{position:fixed;inset:0;pointer-events:none;z-index:200;display:none}

header{position:sticky;top:0;z-index:50;background:rgba(31,34,37,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.hd{display:flex;align-items:center;gap:14px;height:58px}
.brand{display:flex;align-items:baseline;gap:9px;flex-shrink:0}
.brand{cursor:pointer}
.wm{display:flex;align-items:baseline;gap:.5px}
.wm b{font-weight:600;font-size:18px;letter-spacing:-.02em;line-height:1;display:inline-block;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.wm b.sp{width:6px}
.brand:hover .wm b{transform:translateY(-2px)}
.brand:hover .wm b:nth-child(2n){transform:translateY(2px)}
.brand span{font-size:11px;color:var(--tx3);font-family:var(--fm)}
@keyframes drop{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}
nav{display:flex;gap:1px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nv{padding:7px 11px;border-radius:9px;font-size:13.5px;color:var(--tx2);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:.16s}
.nv:hover{background:var(--s2);color:var(--tx)}
.nv.on{background:var(--s3);color:var(--tx)}
.nv svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

section{display:none;padding:26px 0 44px}
section.on{display:block;animation:fi .3s cubic-bezier(.16,1,.3,1)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h2{font-size:22px;font-weight:400;letter-spacing:-.015em;margin-bottom:2px}
.sub{font-size:13.5px;color:var(--tx3);margin-bottom:22px}
.eyebrow{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx3);font-weight:500}

.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:17px 19px}
.card.pad0{padding:15px 11px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw table{min-width:600px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.stat .lab{font-size:11.5px;color:var(--tx3);display:flex;align-items:center;gap:6px}
.stat .val{font-size:31px;font-weight:400;letter-spacing:-.02em;line-height:1.2;margin-top:4px}
.stat .val small{font-size:12.5px;color:var(--tx3);margin-left:3px;font-weight:300}
.stat .note{font-size:11.5px;color:var(--tx3)}

.hero{background:var(--s1);border:1px solid var(--bd);border-radius:15px;padding:24px 26px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:28px;align-items:center}
.hero .big{font-size:70px;line-height:.92;letter-spacing:-.035em;font-weight:500}
.hero .big i{font-style:normal;color:var(--ac)}
.hbar{flex:1;min-width:230px}
.track{height:5px;background:var(--s3);border-radius:4px;overflow:hidden;margin:9px 0 7px}
.track i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.hrow{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3)}
.ring{position:relative;width:104px;height:104px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid b{font-size:29px;font-weight:500;line-height:1;letter-spacing:-.02em}
.ring .mid s{text-decoration:none;font-size:9.5px;color:var(--tx3);letter-spacing:.09em;text-transform:uppercase;margin-top:2px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 13px;border-radius:22px;font-size:13px;background:var(--s2);border:1px solid var(--bd);color:var(--tx2);display:flex;align-items:center;gap:6px;transition:.16s;user-select:none;font-weight:300}
.chip:hover{border-color:var(--bd2);color:var(--tx);transform:translateY(-1px)}
.chip.on{background:var(--acd);border-color:var(--acb);color:var(--ac);font-weight:400}
.chip.ok{background:var(--okd);border-color:#3C5745;color:var(--ok)}
.chip em{font-style:normal;font-size:15px;line-height:1}
.chip.sq{border-radius:9px}

.fld{margin-bottom:15px}
.fld>label{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--tx2);margin-bottom:7px}
.fld>label b{font-weight:500;color:var(--tx);font-family:var(--fm);font-size:12.5px}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;transition:.16s;font-weight:300}
input:hover,select:hover,textarea:hover{border-color:var(--bd2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acb);background:var(--s3)}
textarea{resize:vertical;min-height:72px;line-height:1.65}
input[type=range]{width:100%;-webkit-appearance:none;background:transparent;height:22px}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--s3);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ac);margin-top:-6px;border:none;transition:.15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:4px;background:var(--s3);border-radius:3px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:var(--ac)}
.btn{padding:9px 16px;border-radius:9px;background:var(--s2);border:1px solid var(--bd);font-size:13.5px;color:var(--tx2);transition:.16s;font-weight:400}
.btn:hover{background:var(--s3);border-color:var(--bd2);color:var(--tx)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acd);border-color:var(--acb);color:var(--ac)}
.btn.pri:hover{background:#2A3F49}
.btn.dgr:hover{background:var(--rod);border-color:#5A3B3B;color:var(--ro)}
.btn.sm{padding:5px 11px;font-size:12.5px}

.heat{display:flex;gap:17px;overflow-x:auto;padding:2px 0 8px 1px}
.hcol{display:flex;flex-direction:column;gap:3px;width:11px;flex-shrink:0}
.hmo{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.hwk{display:flex;gap:3px}
.hc{width:11px;height:11px;border-radius:3px;background:var(--s2);flex-shrink:0;transition:.12s}
.hc:hover{outline:1px solid var(--bd2);transform:scale(1.25)}
.hc.f{opacity:.3}
.hc.td{box-shadow:0 0 0 1.5px var(--tx2)}
.hm{font-size:10px;color:var(--tx3);line-height:14px;white-space:nowrap;letter-spacing:.07em;text-transform:uppercase}
.lg{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--tx3);margin-top:10px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);padding:0 9px 9px;border-bottom:1px solid var(--bd)}
td{padding:9px;border-bottom:1px solid var(--bd)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--s2)}

.pill{font-size:10.5px;padding:3px 9px;border-radius:6px;font-weight:500;letter-spacing:.02em;white-space:nowrap;display:inline-block}
.p-ac{background:var(--acd);color:var(--ac)} .p-ok{background:var(--okd);color:var(--ok)}
.p-am{background:var(--amd);color:var(--am)} .p-ro{background:var(--rod);color:var(--ro)}
.p-pu{background:var(--pud);color:var(--pu)} .p-nu{background:var(--s3);color:var(--tx3)}
.hr{height:1px;background:var(--bd);margin:18px 0}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mut{color:var(--tx3);font-size:12.5px}
.empty{text-align:center;padding:34px 20px;color:var(--tx3);font-size:13.5px}
.empty b{display:block;color:var(--tx2);font-size:14.5px;font-weight:400;margin-bottom:4px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:15px}
.tb{padding:6px 13px;border-radius:9px;font-size:13px;color:var(--tx3);border:1px solid transparent;font-weight:300}
.tb:hover{color:var(--tx)}
.tb.on{background:var(--s2);border-color:var(--bd);color:var(--tx);font-weight:400}
.toast{position:fixed;bottom:24px;left:50%;max-width:min(560px,90vw);line-height:1.55;transform:translateX(-50%) translateY(90px);background:var(--s3);border:1px solid var(--bd2);padding:10px 20px;border-radius:11px;font-size:13.5px;z-index:99;transition:.3s cubic-bezier(.16,1,.3,1);opacity:0}
.toast.on{transform:translateX(-50%);opacity:1}
.bars{display:flex;flex-direction:column;gap:10px}
.bar .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.bar .t span{color:var(--tx2)} .bar .t b{font-weight:500;font-family:var(--fm);font-size:12px}
.bar .g{height:6px;background:var(--s2);border-radius:4px;overflow:hidden}
.bar .g i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.16,1,.3,1)}
.ck{width:18px;height:18px;border-radius:6px;border:1px solid var(--bd2);background:var(--s2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:.16s}
.ck:hover{border-color:var(--ac)}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck svg{width:11px;height:11px;stroke:#1F2225;stroke-width:3;fill:none;opacity:0;stroke-linecap:round;stroke-linejoin:round}
.ck.on svg{opacity:1}
.tmr{font-size:62px;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums;font-weight:500}
.sk{padding:12px 15px;border-radius:10px;border:1px solid var(--bd);background:var(--s2);display:flex;gap:12px;align-items:center}
.sk em{font-style:normal;font-size:20px}
.sk b{font-weight:400;font-size:13.5px;display:block}
.sk span{font-size:12px;color:var(--tx3)}
.dots{display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--s3)}
.dot.y{background:var(--ok)} .dot.n{background:var(--rod)} .dot.t{outline:1.5px solid var(--tx3)}
.hrow2{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--bd)}
.hrow2:last-child{border-bottom:none}
.hrow2 .nm{flex:1;font-size:13.5px;display:flex;align-items:center;gap:8px}
.warn{background:var(--amd);border:1px solid #4A3A22;border-radius:10px;padding:11px 14px;font-size:13px;color:var(--am);display:flex;gap:9px;align-items:flex-start;margin-bottom:12px}
.mac{display:flex;flex-direction:column;gap:3px;flex:1;min-width:74px}
.mac .n{font-size:11px;color:var(--tx3)}
.mac .v{font-size:16px;font-weight:500;font-family:var(--fm)}
.mac .g{height:4px;background:var(--s2);border-radius:3px;overflow:hidden;margin-top:2px}
.mac .g i{display:block;height:100%;border-radius:3px}
.fd{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13.5px}
.fd:last-child{border-bottom:none}
.srch{position:relative}
.res{position:absolute;top:100%;left:0;right:0;background:var(--s3);border:1px solid var(--bd2);border-radius:10px;margin-top:5px;max-height:270px;overflow-y:auto;z-index:20;display:none}
.res.on{display:block}
.res div{padding:9px 13px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--bd)}
.res div:hover{background:var(--s4)}
.res div:last-child{border-bottom:none}
.res span{color:var(--tx3);font-size:11.5px;float:right;font-family:var(--fm)}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.mo{width:46px;height:46px;border-radius:13px;background:var(--s2);border:1px solid var(--bd);font-size:22px;display:flex;align-items:center;justify-content:center;transition:.16s}
.mo:hover{transform:translateY(-2px);border-color:var(--bd2)}
.mo.on{background:var(--acd);border-color:var(--acb);transform:scale(1.06)}
.exq{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.exq input{width:66px;text-align:center;padding:6px 4px;font-family:var(--fm)}
.exq .sn{font-size:11px;color:var(--tx3);width:34px;font-family:var(--fm)}
.setb{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:13px 15px;margin-bottom:10px}
.card{transition:border-color .18s,transform .18s}
.stat{position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac);opacity:.55}
.stat.c2::before{background:var(--ok)} .stat.c3::before{background:var(--am)}
.stat.c4::before{background:var(--pu)} .stat.c5::before{background:var(--ro)}
.stat:hover{transform:translateY(-2px);border-color:var(--bd2)}
.hero{background:linear-gradient(135deg,var(--s1) 0%,#282D33 58%,var(--s1) 100%);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(127,176,196,.16),transparent 68%);pointer-events:none}
.stg{animation:rise .45s cubic-bezier(.16,1,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);animation:glow 2.2s infinite;margin-right:5px}
.bed{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 12px;border-radius:20px;
  background:var(--s2);border:1px solid var(--bd);color:var(--tx2);white-space:nowrap}
.bed.soon{background:var(--amd);border-color:#4A3A22;color:var(--am)}
.bed.late{background:var(--rod);border-color:#5A3B3B;color:var(--ro)}
.pal{position:fixed;inset:0;background:rgba(14,16,18,.72);backdrop-filter:blur(6px);z-index:400;display:none;
  align-items:flex-start;justify-content:center;padding:12vh 20px}
.pal.on{display:flex}
.palb{width:100%;max-width:560px;background:var(--s1);border:1px solid var(--bd2);border-radius:15px;
  overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.5);animation:rise .22s cubic-bezier(.16,1,.3,1)}
.palb input{background:transparent;border:none;border-bottom:1px solid var(--bd);border-radius:0;
  padding:16px 19px;font-size:16px;font-weight:300}
.palb input:focus{background:transparent;border-color:var(--bd)}
.pl2{max-height:min(420px,52vh);overflow-y:auto;padding:7px}
.pi{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--tx2)}
.pi em{font-style:normal;font-size:16px;width:20px;text-align:center}
.pi .k{margin-left:auto;font-size:10.5px;color:var(--tx3);font-family:var(--fm);
  border:1px solid var(--bd);padding:1px 6px;border-radius:5px}
.pi.sel{background:var(--s3);color:var(--tx)}
.pi.sel .k{border-color:var(--bd2)}
.palf{padding:8px 15px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--tx3);display:flex;gap:14px}
tr.rsel{background:var(--s2);box-shadow:inset 2px 0 0 var(--ac)}
.kbd{font-family:var(--fm);font-size:10.5px;border:1px solid var(--bd);border-radius:5px;padding:1px 6px;color:var(--tx3)}
.quo{background:linear-gradient(120deg,var(--s1),#2B3036 60%,var(--s1));border:1px solid var(--bd);
  border-radius:13px;padding:19px 22px;margin-bottom:12px;display:flex;gap:16px;align-items:flex-start}
.quo .mk{font-size:34px;line-height:1;color:var(--acb);flex-shrink:0;margin-top:-4px}
.quo .tx{font-size:17px;line-height:1.5;font-weight:300}
.quo .by{font-size:12px;color:var(--tx3);margin-top:6px}
.quo button{margin-left:auto;flex-shrink:0;color:var(--tx3);font-size:15px;align-self:center}
.quo button:hover{color:var(--tx)}
.bdg{display:flex;flex-wrap:wrap;gap:9px}
.bd1{width:78px;text-align:center;opacity:.32;transition:.2s}
.bd1.got{opacity:1}
.bd1 .ic{width:52px;height:52px;margin:0 auto 6px;border-radius:16px;background:var(--s2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;font-size:24px;transition:.2s}
.bd1.got .ic{background:var(--acd);border-color:var(--acb);box-shadow:0 3px 14px rgba(127,176,196,.16)}
.bd1:hover .ic{transform:translateY(-3px)}
.bd1 .nm{font-size:10.5px;line-height:1.3;color:var(--tx3)}
.bd1.got .nm{color:var(--tx2)}
.mstone{background:linear-gradient(120deg,var(--acd),#2E3A42);border:1px solid var(--acb);border-radius:13px;
  padding:17px 21px;margin-bottom:12px;display:flex;gap:15px;align-items:center}
.mstone em{font-style:normal;font-size:30px}
.mstone b{display:block;font-size:16px;font-weight:500}
.mstone span{font-size:13px;color:var(--tx2)}
.fc{background:var(--s1);border:1px solid var(--bd);border-radius:15px;padding:34px 30px;min-height:250px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;
  transition:.2s;position:relative}
.fc:hover{border-color:var(--bd2)}
.fc .q{font-size:22px;line-height:1.45;font-weight:300;max-width:600px}
.fc .a{font-size:17px;line-height:1.6;color:var(--ac);margin-top:20px;padding-top:20px;
  border-top:1px solid var(--bd);max-width:620px;animation:rise .28s cubic-bezier(.16,1,.3,1)}
.fc .hint{position:absolute;bottom:14px;font-size:11.5px;color:var(--tx3)}
.fc .tag{position:absolute;top:14px;left:16px}

function parseTime(v){
  if(v==null)return null;
  let t=String(v).trim().toLowerCase().replace(/\s+/g,'').replace(/\./g,':');
  if(!t)return '';
  const pm=/pm$/.test(t),am=/am$/.test(t);t=t.replace(/[ap]m$/,'');
  let h,m;
  if(/^\d{1,2}:\d{1,2}$/.test(t)){const q=t.split(':');h=+q[0];m=+q[1]}
  else if(/^\d{4}$/.test(t)){h=+t.slice(0,2);m=+t.slice(2)}
  else if(/^\d{3}$/.test(t)){h=+t.slice(0,1);m=+t.slice(1)}
  else if(/^\d{1,2}$/.test(t)){h=+t;m=0}
  else return null;
  if(pm&&h<12)h+=12;if(am&&h===12)h=0;
  if(h>23||m>59)return null;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}

function countUp(){$$('#s-dash .stat .val').forEach(el=>{

  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    el.firstChild.nodeValue=(n*e).toFixed(dec);if(k<1)requestAnimationFrame(step)};
  el.firstChild.nodeValue='0';requestAnimationFrame(step)})}

function stat(e,l,v,u,n){const c=['','c2','c3','c4','c5'][statN++%5];
  return `<div class="card stat ${c} stg" style="animation-delay:${(statN%8)*0.04}s"><div class="lab"><span style="font-size:14px">${e}</span>${l}</div>

/* what to study next, and whether the plan is holding */
function studyQueue(){
  const out=[];
  for(const pk in CH)CH[pk].forEach((c,i)=>{const id=cid(pk,i),o=D.syl[id]||{};
    const due=(D.plan.dates||{})[id];
    if(o.st==='ip')out.push({pk,c,why:'in progress',rank:0,id});
    else if(o.st==='done'&&o.conf&&o.conf<=2)out.push({pk,c,why:'confidence '+o.conf+'/5',rank:1,id});
    else if(o.st==='redo')out.push({pk,c,why:'needs redo',rank:1,id});
    else if(o.st!=='done'&&due&&due<TODAY)out.push({pk,c,why:'overdue '+Math.abs(diff(TODAY,due))+'d',rank:2,id});
    else if(o.st!=='done'&&due&&diff(TODAY,due)<=3)out.push({pk,c,why:'due '+fmt(due),rank:3,id});
    else if(o.st==='done'&&!o.r1&&o.conf&&o.conf===3)out.push({pk,c,why:'never revised',rank:4,id})});
  return out.sort((a,b)=>a.rank-b.rank).slice(0,6)}
function pace(){
  const dates=D.plan.dates||{};const ids=Object.keys(dates).filter(id=>syl(id).st!=='done');
  if(!ids.length)return null;
  const pk=ids[0].split('-')[0];
  const lastDue=ids.map(i=>dates[i]).sort().slice(-1)[0];
  const done=daysList().filter(d=>d<=TODAY&&logged(d));
  const recent=done.slice(-14);
  const hrs=recent.reduce((a,d)=>a+nn((D.days[d].sub||{})[pk]),0);
  const rate=recent.length?hrs/recent.length:0;
  const spd=nn(D.plan.spd||1.6),mul=nn(D.plan.mul??0.8);
  const left=ids.reduce((a,i)=>a+nn((D.plan.lec||{})[i]??LEC[i])/spd*(1+mul),0);
  if(!left)return null;
  const daysNeeded=rate>0?Math.ceil(left/rate):null;
  const eta=daysNeeded?addD(TODAY,daysNeeded):null;
  return{pk,left:Math.round(left),rate:rate.toFixed(1),eta,lastDue,
    drift:eta?diff(lastDue,eta):null,chapters:ids.length}}

    return `<div class="hc${fut?' f':''}${d===TODAY?' td':''}" style="background:${bg}" title="${fmt(d,{weekday:'short',day:'numeric',month:'short'})} — ${rs?dtype(d):s!=null?s+'/100 · '+dtype(d):'not logged'}"></div>`};
  const mo=[];let d=START;

  box.innerHTML=mo.map((m,mi)=>{

      <div class="hwk">${cols.map(c=>`<div class="hcol">${c.join('')}</div>`).join('')}</div></div>`}).join('')}

let fired={};
function fireIf(){save();

}

/* ---- timer ---- */
let T={run:0,left:5400,len:5400,paper:'P2',iv:null,mode:'block'};
function tSave(){D.timer={run:T.run,left:T.left,len:T.len,paper:T.paper,mode:T.mode,at:Date.now()};save()}
function tLoad(){const t=D.timer;if(!t)return;
  T.len=t.len||5400;T.paper=t.paper||'P2';T.mode=t.mode||'block';T.left=t.left??T.len;
  if(t.run&&t.at){const gone=Math.floor((Date.now()-t.at)/1000);
    T.left=t.left-gone;
    if(T.left<=0){T.left=T.len;T.run=0;tSave();
      setTimeout(()=>toast('Your block finished while you were away — log it from the timer'),1400)}
    else{T.run=1;tick()}}}
function vTimer(){
  const el=$('#s-timer'),x=day(TODAY);
  const R=92,C=2*Math.PI*R,off=C*(1-T.left/T.len);
  const m=String(Math.floor(T.left/60)).padStart(2,'0'),s=String(T.left%60).padStart(2,'0');
  const fey=T.mode==='feynman';
  el.innerHTML=`<h2>${fey?'Feynman review':'Block timer'}</h2>
  <div class="sub">${fey?'Book closed. Explain it out loud, standing up, as if to a first-year.'
    :'Ninety minutes, one paper, phone in another room.'}</div>
  ${T.armed?`<div class="mstone stg"><em>🗣</em><div><b>Block done — now teach it</b>
    <span>Stand up. Close everything. Explain what you just studied out loud for fifteen minutes.
    Wherever you stumble is exactly what to revise tomorrow.</span></div></div>`:''}
  <div class="grid g2" style="align-items:start">
    <div class="card" style="text-align:center;padding:32px 20px">
      <div style="position:relative;width:214px;height:214px;margin:0 auto 24px">
        <svg width="214" height="214" style="transform:rotate(-90deg)">
          <circle cx="107" cy="107" r="${R}" stroke="var(--s3)" stroke-width="6" fill="none"/>
          <circle cx="107" cy="107" r="${R}" stroke="var(${fey?'--am':'--ac'})" stroke-width="6" fill="none" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s linear"/></svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div class="tmr">${m}:${s}</div><div class="eyebrow" style="margin-top:6px">${T.run?(fey?'teaching':'focusing'):'ready'}</div></div></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-bottom:17px;flex-wrap:wrap">
        <button class="btn pri" id="tg" style="min-width:112px">${T.run?'Pause':'Start block'}</button>
        <button class="btn" id="rs">Reset</button><button class="btn" id="dn">Log it now</button>
        <button class="btn fx" id="fxin">Focus mode</button>
        <button class="btn fxout" id="fxexit">Exit focus · esc</button></div>
      <div class="chips" style="justify-content:center">${[45,60,90,120].map(v=>
        `<button class="chip${!fey&&T.len===v*60?' on':''}" data-len="${v}">${v} min</button>`).join('')}
        <button class="chip${fey?' on':''}" id="feyn" title="Teach it out loud"><em>🗣</em>15 min · Feynman</button></div>
      ${fey?`<p class="mut" style="margin-top:13px;max-width:420px;margin-left:auto;margin-right:auto">
        Say it in plain words. No jargon you cannot unpack. If a step goes fuzzy, that is tomorrow's revision.</p>`:''}</div>
    <div>
      <div class="card" style="margin-bottom:12px"><div class="eyebrow" style="margin-bottom:12px">Studying</div>
        <div class="chips">${Object.keys(PAPERS).map(p=>`<button class="chip${T.paper===p?' on':''}" data-tp="${p}">${PAPERS[p].s}</button>`).join('')}</div>
        <p class="mut" style="margin-top:12px">Finishing a block adds one to today's count and the elapsed time to ${PAPERS[T.paper].s}.</p></div>
      <div class="card"><div class="rowb" style="margin-bottom:14px"><span class="eyebrow">Today so far</span>
        <span>${x.feyn?`<span class="pill p-am" style="margin-right:5px">🗣 ${x.feyn}</span>`:''}<span class="pill p-ac">${x.blocks} blocks · ${nn(x.hours).toFixed(1)}h</span></span></div>
        <div class="bars">${Object.keys(PAPERS).map(p=>{const h=nn((x.sub||{})[p]);
          return h?`<div class="bar"><div class="t"><span>${PAPERS[p].s}</span><b>${h.toFixed(1)}h</b></div>
          <div class="g"><i style="width:${cl(h/8*100,0,100)}%;background:var(${PAPERS[p].c})"></i></div></div>`:''}).join('')
          ||'<p class="mut">Nothing logged yet today.</p>'}</div></div></div></div>`;
  $('#tg').onclick=()=>{T.run=!T.run;if(T.run)tick();else clearInterval(T.iv);tSave();vTimer()};
  $('#rs').onclick=()=>{clearInterval(T.iv);T.run=0;T.left=T.len;tSave();vTimer()};
  $('#dn').onclick=()=>finish(T.len-T.left);
  $('#rs').onclick=()=>{clearInterval(T.iv);T.run=0;T.armed=0;T.left=T.len;tSave();vTimer()};
  $$('[data-len]').forEach(b=>b.onclick=()=>{if(T.run)return;
    T.mode='block';T.armed=0;T.len=+b.dataset.len*60;T.left=T.len;tSave();vTimer()});
  $('#feyn').onclick=()=>{if(T.run)return;
    T.mode='feynman';T.armed=0;T.len=900;T.left=900;T.run=1;tick();tSave();vTimer();

  $$('[data-tp]').forEach(b=>b.onclick=()=>{T.paper=b.dataset.tp;tSave();vTimer()});
  $('#fxin').onclick=()=>{document.body.classList.add('focus');toast('Focus mode. Escape to leave.')};
  $('#fxexit').onclick=()=>document.body.classList.remove('focus');
}
function tick(){clearInterval(T.iv);let n=0;T.iv=setInterval(()=>{T.left--;
  if(++n%10===0)tSave();
  if(T.left<=0){clearInterval(T.iv);T.run=0;finish(T.len);celebrate();return}
  if(D.tab==='timer')vTimer()},1000)}
function finish(sec){clearInterval(T.iv);T.run=0;
  const wasFey=T.mode==='feynman';
  const h=Math.round(sec/360)/10;
  if(h<=0){T.left=T.len;vTimer();return}
  const x=day(TODAY);
  x.sub=x.sub||{};x.sub[T.paper]=Math.round((nn(x.sub[T.paper])+h)*10)/10;
  x.hours=Math.round((nn(x.hours)+h)*10)/10;
  if(wasFey){x.feyn=(x.feyn||0)+1;
    T.mode='block';T.armed=0;T.len=5400;T.left=5400;tSave();save();
    if(D.tab==='timer')vTimer();
    toast(`Taught it. ${x.feyn} review${x.feyn>1?'s':''} today — write down wherever you stumbled.`)}
  else{x.blocks=cl(x.blocks+1,0,8);
    T.mode='feynman';T.armed=1;T.len=900;T.left=900;tSave();save();
    if(D.tab!=='timer'){D.tab='timer';shell()}
    vTimer();
    toast(`Block logged — ${h}h on ${PAPERS[T.paper].s}. Now teach it for fifteen.`)}}

function wirePlan(){
  $('#pGo')&&($('#pGo').onclick=()=>{
    const st=$('#pS').value,hrs=nn($('#pH').value),spd=nn($('#pX').value)||1.6,
      mul=nn($('#pM').value),buf=nn($('#pB').value);
    D.plan={start:st,hrs,spd,mul,buf,lec:D.plan.lec||{},dates:{}};
    let cur=st,budget=hrs,wcount=0,bufLeft=buf;
    CH[sylP].forEach((c,i)=>{const id=cid(sylP,i);if(syl(id).st==='done')return;
      const lh=nn(D.plan.lec[id]??LEC[id]);if(!lh)return;
      let need=lh/spd*(1+mul);
      while(need>0){if(budget<=0){cur=addD(cur,1);wcount++;
        if(wd(cur)===6){cur=addD(cur,1);wcount++}
        if(bufLeft>0&&wcount%6===0){cur=addD(cur,1);bufLeft--}
        budget=hrs}
        const use=Math.min(need,budget);need-=use;budget-=use}
      D.plan.dates[id]=cur});
    save();vSyl();toast('Plan generated with buffer days built in')});
  $$('.pl').forEach(i=>i.oninput=()=>{D.plan.lec=D.plan.lec||{};D.plan.lec[i.dataset.id]=i.value===''?'':+i.value;save()});
  $$('.pd').forEach(i=>i.onchange=()=>{D.plan.dates=D.plan.dates||{};D.plan.dates[i.dataset.id]=i.value;save();vSyl()});
}

function shrink(file,cb){const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const M=760;let w=im.width,h=im.height;
      if(w>M||h>M){const k=M/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.72))};
    im.src=r.result};
  r.readAsDataURL(file)}

function grade(c,q){ // q: 0 again, 1 hard, 2 good, 3 easy  →  SM-2 quality 2,3,4,5
  const Q=q+2;c.ease=Math.max(1.3,(c.ease||2.5)+(0.1-(5-Q)*(0.08+(5-Q)*0.02)));
  if(Q<3){c.reps=0;c.int=1;c.lapses=(c.lapses||0)+1}
  else{const was=c.reps||0;c.reps=was+1;
    c.int=was===0?(q===3?4:1):was===1?(q===1?4:6):Math.round((c.int||1)*c.ease);
    if(q===1&&was>1)c.int=Math.max(1,Math.round(c.int*0.7));
    if(q===3&&was>1)c.int=Math.round(c.int*1.3)}
  c.due=addD(TODAY,Math.max(1,c.int));c.seen=TODAY;save()}

function nextIn(c,q){const Q=q+2,was=c.reps||0;

    if(q===3)i=Math.round(i*1.3)}
  i=Math.max(1,i);return i<30?i+'d':i<365?Math.round(i/30)+'mo':(i/365).toFixed(1)+'y'}

function vRev(){
  const el=$('#s-rev'),W0=addD(START,-wd(START));

  for(let i=0;i<48;i++){const s=addD(W0,i*7);if(s>END)break;
    const ds=[];for(let j=0;j<7;j++){const d=addD(s,j);if(d>=START&&d<=END)ds.push(d)}
    const lg=ds.filter(logged);if(!lg.length&&s>TODAY)continue;
    wks.push({i:i+1,s,ds,lg,h:lg.reduce((a,d)=>a+nn(D.days[d].hours),0),
      b:lg.reduce((a,d)=>a+nn(D.days[d].blocks),0),g:lg.filter(d=>D.days[d].gym).length,
      sc:lg.length?Math.round(lg.reduce((a,d)=>a+(score(d)||0),0)/lg.length):0,
      sp:lg.reduce((a,d)=>a+nn(D.days[d].spent),0)})}
  const done=wks.filter(w=>w.s<=TODAY),cur=done[done.length-1],prev=done[done.length-2];

  let wins=[],drops=[],why=[];

      if(!d.length)return;const r=hit.length/d.length;
      if(r>=0.85)wins.push(`${h.e} ${h.n} — ${hit.length}/${d.length}`);
      else if(r<0.5)drops.push(`${h.e} ${h.n} — only ${hit.length}/${d.length}`)});
    const full=cur.lg.filter(d=>D.days[d].blocks>=6).length;
    if(full)wins.push(`🧱 ${full} full study day${full>1?'s':''} of six blocks`);

    const miss=cur.lg.filter(d=>dtype(d)==='Missed').length;

    const bestD=cur.lg.slice().sort((a,b)=>(score(b)||0)-(score(a)||0))[0];
    if(bestD)wins.push(`⭐ Best day was ${fmt(bestD,{weekday:'long'})} at ${score(bestD)}/100`);
    const fc={};cur.lg.forEach(d=>(D.days[d].fric||[]).forEach(f=>fc[f]=(fc[f]||0)+1));
    why=Object.entries(fc).sort((a,b)=>b[1]-a[1]).slice(0,4);

    <div class="hr"></div>

        ${wins.length?wins.map(w=>`<div style="font-size:13.5px;padding:5px 0;color:var(--tx2)">${w}</div>`).join(''):'<p class="mut">Log a few more days and this fills itself in.</p>'}</div>

function rvs(l,v,d,u,inv){const up=d>0,cls=d==null?'p-nu':(inv?(up?'p-ro':'p-ok'):(up?'p-ok':'p-ro'));

function shareCard(w,wins,rv){
  const W=1080,H=1080,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1F2225');g.addColorStop(.55,'#282D33');g.addColorStop(1,'#1F2225');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  const cols=['#7FB0C4','#8FBF9F','#D9B57E','#A99BD4','#C98B8B'];
  const F=(s,w2=400)=>`${w2} ${s}px Outfit, sans-serif`;
  // wordmark
  const nm=(D.name||'THE LONG GAME').toUpperCase();let px=72;
  x.font=F(38,600);[...nm].forEach((ch,i)=>{if(ch===' '){px+=14;return}
    x.fillStyle=cols[i%5];x.fillText(ch,px,110);px+=x.measureText(ch).width+1});
  x.fillStyle='#6B747C';x.font=F(24);
  x.fillText(`Week ${w.i}  ·  ${fmt(w.s,{day:'numeric',month:'short'})} — ${fmt(w.ds[w.ds.length-1],{day:'numeric',month:'short',year:'numeric'})}`,72,152);
  // big score
  x.fillStyle='#E5E9ED';x.font=F(200,500);x.fillText(String(w.sc),72,360);
  const sw=x.measureText(String(w.sc)).width;
  x.fillStyle='#6B747C';x.font=F(40);x.fillText('/100',72+sw+14,360);
  x.fillStyle='#98A2AB';x.font=F(26);x.fillText('average day this week',72,404);
  // metric tiles
  const tiles=[['Hours',w.h.toFixed(1)],['Blocks',String(w.b)],['Gym',w.g+'/6'],['Streak',String(streak())]];
  tiles.forEach((t,i)=>{const tx=72+i*234,ty=456;
    x.fillStyle='#262A2E';rr(x,tx,ty,214,150,18);x.fill();
    x.fillStyle=cols[i];rr(x,tx,ty,5,150,3);x.fill();
    x.fillStyle='#6B747C';x.font=F(22);x.fillText(t[0],tx+26,ty+44);
    x.fillStyle='#E5E9ED';x.font=F(58,500);x.fillText(t[1],tx+26,ty+110)});
  // wins
  x.fillStyle='#6B747C';x.font=F(22,500);x.fillText('WHAT WENT WELL',72,672);
  x.fillStyle='#98A2AB';x.font=F(28);
  wins.slice(0,4).forEach((wn,i)=>x.fillText(wn.replace(/[^\x00-\x7F]/g,'').replace(/\s+/g,' ').trim().slice(0,52),72,724+i*46));
  // adjustment
  if(rv.adj){x.fillStyle='#262A2E';rr(x,72,900,936,110,18);x.fill();
    x.fillStyle='#7FB0C4';rr(x,72,900,5,110,3);x.fill();
    x.fillStyle='#6B747C';x.font=F(20,500);x.fillText('NEXT WEEK, ONE CHANGE',98,940);
    x.fillStyle='#E5E9ED';x.font=F(28);x.fillText(rv.adj.slice(0,58),98,984)}
  x.fillStyle='#4A525B';x.font=F(20);
  x.fillText(`${Math.max(0,diff(TODAY,EXAM))} days to the exam`,72,H-44);
  c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=`week-${w.i}-summary.png`;a.click();
    setTimeout(()=>URL.revokeObjectURL(u),900);toast('Summary card saved')},'image/png');
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);
  x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}

function migrate(o){
  if(!o||typeof o!=='object')return o;
  // v1 stored one flat row per set; v2 groups sets under an exercise
  if(Array.isArray(o.gym)&&o.gym.some(g=>g&&!Array.isArray(g.sets))){
    const grp={},out=[];
    o.gym.forEach(g=>{if(!g)return;
      if(Array.isArray(g.sets)){out.push(g);return}
      const k=g.d+'|'+g.ex;
      if(!grp[k]){grp[k]={d:g.d,part:g.part||g.sp||'Other',ex:g.ex,sets:[]};out.push(grp[k])}
      grp[k].sets.push({r:g.reps??g.r??'',w:g.wt??g.w??''})});
    o.gym=out}
  if(Array.isArray(o.gym))o.gym.forEach(g=>{if(g&&!Array.isArray(g.sets))g.sets=[]});
  else o.gym=[];
  // old saves keyed chapters by position (P2-5). Re-key them by name, once.
  const oldId=/^(P[1-6])-(\d+)$/;
  const remap=id=>{const m=oldId.exec(id);if(!m)return id;
    const p=m[1],i=+m[2];return (CH[p]&&CH[p][i])?cid(p,i):id};
  if(o.syl&&typeof o.syl==='object'){const nx={};
    for(const k in o.syl)nx[remap(k)]=o.syl[k];o.syl=nx}
  if(o.plan&&typeof o.plan==='object'){
    ['lec','dates'].forEach(f=>{if(o.plan[f]&&typeof o.plan[f]==='object'){
      const nx={};for(const k in o.plan[f])nx[remap(k)]=o.plan[f][k];o.plan[f]=nx}})}
  ['wt','mock','tasks','cards'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
  ['days','syl','mile','meals','jr','plan','grat','rev','badges','ms'].forEach(k=>{
    if(!o[k]||typeof o[k]!=='object'||Array.isArray(o[k]))o[k]={}});
  return o}
function blank(){return{days:{},syl:{},gym:[],wt:[],mock:[],mile:{},meals:{},jr:{},plan:{},grat:{},rev:{},tasks:[],cards:[],badges:{},ms:{},name:'THE LONG GAME',tab:'dash'}}
function csv(rows){return rows.map(r=>r.map(v=>{const s=String(v??'');
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n')}
function dl(name,text){const b=new Blob([text],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),900);toast('Downloaded '+name)}

  for(const k of ['caf_v1']){const o=await read(k);

function palMatch(v){if(!v)return palA.slice(0,9);
  const t=v.toLowerCase();
  return palA.map(a=>{const s=(a.t+' '+a.k).toLowerCase();let i=s.indexOf(t);
    return {a,sc:i<0?(fuzzy(s,t)?400:-1):i}}).filter(x=>x.sc>=0)
    .sort((x,y)=>x.sc-y.sc).slice(0,9).map(x=>x.a)}
function fuzzy(s,t){let i=0;for(const c of s)if(c===t[i])i++;return i===t.length}
function palRender(v){const list=palMatch(v);palI=Math.min(palI,Math.max(0,list.length-1));
  $('#pl').innerHTML=list.length?list.map((a,i)=>
    `<div class="pi${i===palI?' sel':''}" data-pi="${i}"><em>${a.e}</em>${esc(a.t)}<span class="k">${a.k}</span></div>`).join('')

document.addEventListener('keydown',e=>{
